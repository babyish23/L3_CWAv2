<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ 台灣天氣預報儀表板</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plotly JS -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- 標題 -->
        <div class="row">
            <div class="col-12">
                <h1 class="main-header">🌤️ 台灣天氣預報儀表板</h1>
                <p class="text-center text-muted">基於中央氣象署開放資料 API 的天氣預報系統</p>
            </div>
        </div>

        <!-- 資料更新區 -->
        <div class="row mb-4 justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">🔄 資料更新</h5>
                        <p class="card-text text-muted">顯示全台縣市天氣預報資料，點擊下方按鈕可手動更新</p>
                        <div class="d-inline-block me-2">
                            <span class="badge bg-primary">總記錄數: <span id="totalRecords">{{ initial_data|length }}</span></span>
                            <span class="badge bg-success">涵蓋縣市: <span id="totalLocations">{{ locations|length }}</span> 個</span>
                        </div>
                        <div class="mt-3">
                            <button type="button" class="btn btn-success me-2" id="updateDataBtn">🔄 更新全部資料</button>
                            <button type="button" class="btn btn-primary" id="refreshPageBtn">🔃 重新載入頁面</button>
                        </div>
                        <small class="text-muted d-block mt-2">最後更新: <span id="lastUpdate">-</span></small>
                    </div>
                </div>
            </div>
        </div>

        <!-- 標籤頁 -->
        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="map-tab" data-bs-toggle="tab" data-bs-target="#map" type="button" role="tab">🗺️ 地圖檢視</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="chart-tab" data-bs-toggle="tab" data-bs-target="#chart" type="button" role="tab">📊 圖表分析</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="data-tab" data-bs-toggle="tab" data-bs-target="#data" type="button" role="tab">📋 詳細資料</button>
            </li>
        </ul>

        <div class="tab-content" id="mainTabsContent">
            <!-- 地圖檢視標籤 -->
            <div class="tab-pane fade show active" id="map" role="tabpanel">
                <div class="row mt-4">
                    <div class="col-12">
                        <div id="weatherMap" style="height: 500px;"></div>
                        <div class="alert alert-info mt-3">
                            💡 地圖說明：紅色=高溫(≥30°C), 橙色=溫暖(25-29°C), 綠色=舒適(20-24°C), 藍色=涼爽(<20°C)
                        </div>
                    </div>
                </div>
            </div>

            <!-- 圖表分析標籤 -->
            <div class="tab-pane fade" id="chart" role="tabpanel">
                <div class="row mt-4">
                    <div class="col-12">
                        <div id="temperatureChart"></div>
                    </div>
                </div>
                
                <!-- 統計摘要 -->
                <div class="row mt-4">
                    <div class="col-md-6">
                        <h5>🌡️ 溫度統計</h5>
                        <div id="tempStats"></div>
                    </div>
                    <div class="col-md-6">
                        <h5>🌧️ 降雨統計</h5>
                        <div id="popStats"></div>
                    </div>
                </div>
            </div>

            <!-- 詳細資料標籤 -->
            <div class="tab-pane fade" id="data" role="tabpanel">
                <div class="row mt-4">
                    <!-- 資料篩選控制 -->
                    <div class="col-md-6">
                        <label for="locationFilter" class="form-label">篩選縣市</label>
                        <select class="form-select" id="locationFilter">
                            <option value="全部">全部</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="sortColumn" class="form-label">排序依據</label>
                        <select class="form-select" id="sortColumn">
                            <option value="start_time">時間</option>
                            <option value="location">縣市</option>
                            <option value="max_temp">最高溫</option>
                            <option value="min_temp">最低溫</option>
                            <option value="pop">降雨機率</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-success d-block" id="downloadBtn">📥 下載CSV</button>
                    </div>
                </div>
                
                <!-- 資料表格 -->
                <div class="row mt-3">
                    <div class="col-12">
                        <div class="table-responsive">
                            <table class="table table-striped" id="weatherTable">
                                <thead>
                                    <tr>
                                        <th>縣市</th>
                                        <th>開始時間</th>
                                        <th>結束時間</th>
                                        <th>天氣現象</th>
                                        <th>最高溫(°C)</th>
                                        <th>最低溫(°C)</th>
                                        <th>降雨機率(%)</th>
                                        <th>舒適度</th>
                                    </tr>
                                </thead>
                                <tbody id="weatherTableBody">
                                    <!-- 資料將由JavaScript載入 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">載入中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer" style="position: fixed; top: 20px; right: 20px; z-index: 1050;"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
